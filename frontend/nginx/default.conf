# Serves the prerendered site and proxies /api to gunicorn. TLS terminates in front of this
# (the host's reverse proxy or load balancer), which is why HSTS is set here but no certs are.

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_req_status 429;
limit_conn_status 429;

# Aggressive caching for hashed assets, none for HTML so a deploy is visible at once.
map $uri $cache_control {
    ~^/assets/          "public, max-age=31536000, immutable";
    ~\.(png|webp|svg|ico|woff2?)$  "public, max-age=604800";
    default             "no-cache";
}

upstream api {
    server api:8000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    charset utf-8;
    client_max_body_size 2m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 15s;
    limit_conn perip 30;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml application/manifest+json;

    # $request_id is 32 hex characters from nginx's CSPRNG: a fresh nonce for every response.
    # Vite writes __CSP_NONCE__ into every script/style tag it emits (vite.config.ts cspNonce).
    sub_filter_once off;
    sub_filter_types text/html;
    sub_filter '__CSP_NONCE__' $request_id;

    set $csp "default-src 'self'; script-src 'nonce-$request_id' 'strict-dynamic'; style-src 'self' 'nonce-$request_id'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'";

    add_header Content-Security-Policy $csp always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cache-Control $cache_control always;

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
        # The API sets its own stricter headers; don't send two CSPs.
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
    }

    location ~ ^/api/v1/auth/(login|register)$ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-store" always;
    }

    location = /index.html { internal; }

    location / {
        try_files $uri $uri/index.html =404;
    }

    location ~* \.(?:map|bak|orig|env)$ { return 404; }
    location ~ /\. { return 404; }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
