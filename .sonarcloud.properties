# Read by SonarQube Cloud automatic analysis (no CI token needed).
sonar.sources=backend/app,frontend/src,frontend/scripts
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,backend/tests/**
sonar.exclusions=frontend/src/api/schema.d.ts,backend/migrations/**,**/node_modules/**,**/dist/**
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8

# css:S8776 ("missing scoping root") misreads Tailwind's @custom-variant block in index.css.
sonar.issue.ignore.multicriteria=tailwind
sonar.issue.ignore.multicriteria.tailwind.ruleKey=css:S8776
sonar.issue.ignore.multicriteria.tailwind.resourceKey=frontend/src/styles/index.css
