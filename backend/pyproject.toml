[project]
name = "offlineshelf"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.1",
    "argon2-cffi==25.1.0",
    "email-validator==2.3.0",
    "flask==3.1.3",
    "flask-limiter==4.1.1",
    "gunicorn==26.2.0",
    "httpx==0.28.1",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "pymysql==1.2.3",
    "redis==8.1.0",
    "rq==3.0.0",
    "sqlalchemy==2.1.6",
]

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF", "N", "PT", "RET", "ARG"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ARG001"]
"migrations/**" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["rq.*", "pymysql.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error", "ignore::DeprecationWarning:rq.*"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
