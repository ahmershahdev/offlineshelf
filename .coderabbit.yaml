# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
tone_instructions: "Short and direct. Point to the line, say what breaks and why."
reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!frontend/src/api/schema.d.ts"
    - "!**/package-lock.json"
    - "!backend/uv.lock"
    - "!frontend/public/**/*.png"
    - "!frontend/public/**/*.webp"
  path_instructions:
    - path: "backend/app/core/**"
      instructions: >-
        Plain Python only: no Flask, SQLAlchemy, Redis or network imports. Needs 100% branch
        coverage. This code is written by the maintainer; review it, never suggest replacing it
        wholesale.
    - path: "backend/app/wiki/**"
      instructions: >-
        The only module that may call Wikimedia APIs. Every request needs the project User-Agent
        with a contact address, maxlag, retries with backoff, and continuation handling. Tests must
        use recorded responses, never live calls.
    - path: "backend/**/*.py"
      instructions: >-
        Check for SQL built from strings, missing owner filters on user data, unbounded input,
        secrets outside environment variables, and failed builds replacing the last good version.
        API changes must update docs/openapi.yaml.
    - path: "frontend/src/**"
      instructions: >-
        TypeScript strict. No inline style attributes in prerendered markup (the CSP blocks them),
        no dangerouslySetInnerHTML, no third-party requests. Titles stay under 60 characters and
        descriptions under 140.
    - path: "**/*.md"
      instructions: "No emojis. No filler words (simply, robust, seamless, leverage, comprehensive)."
  tools:
    ruff:
      enabled: true
    eslint:
      enabled: true
    hadolint:
      enabled: true
    actionlint:
      enabled: true
    gitleaks:
      enabled: true
chat:
  auto_reply: true
